name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aureon .
      - name: smoke test
        run: |
          docker run -d --name aureon -p 8000:8000 aureon
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 0.5; done
          curl -sf localhost:8000/payout | grep -q bc1q
          test "$(docker exec aureon id -u)" = "10001"
